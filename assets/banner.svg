<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" opacity="0.3"/>
    </pattern>

    <style>
      .pulsing-orb {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .shield-float {
        animation: float 6s ease-in-out infinite;
      }
      .ring-spin {
        transform-origin: 1020px 210px;
        animation: spin 20s linear infinite;
      }
      .ring-spin-reverse {
        transform-origin: 1020px 210px;
        animation: spinReverse 25s linear infinite;
      }
      .data-stream {
        stroke-dasharray: 8, 8;
        animation: dash 2s linear infinite;
      }
      .badge-glow {
        animation: pulseGlow 3s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.25; }
        100% { transform: scale(1.15); opacity: 0.45; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -32; }
      }
      @keyframes pulseGlow {
        0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
        100% { filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.8)); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <g class="pulsing-orb">
    <circle cx="1000" cy="200" r="180" fill="#6366f1" filter="url(#glowPurple)" />
    <circle cx="200" cy="80" r="120" fill="#0284c7" opacity="0.15" filter="url(#glowCyan)" />
    <circle cx="950" cy="320" r="140" fill="#38bdf8" opacity="0.2" filter="url(#glowCyan)" />
  </g>

  <!-- Interactive / Dynamic Graphic Elements on Right side (Strictly positioned to NOT hide text) -->
  <!-- Rotating Tech Rings -->
  <g class="ring-spin">
    <circle cx="1020" cy="210" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="15 30 40 10" opacity="0.5" />
    <circle cx="1020" cy="210" r="150" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="20 40 10 25" opacity="0.4" />
  </g>
  <g class="ring-spin-reverse">
    <circle cx="1020" cy="210" r="110" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="40 15 20 15" opacity="0.6" />
    <circle cx="1020" cy="210" r="85" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 12" opacity="0.3" />
  </g>

  <!-- Connecting Data Stream Flow Lines -->
  <path d="M 780 130 C 880 130, 930 180, 1020 210" fill="none" stroke="#38bdf8" stroke-width="2" class="data-stream" opacity="0.6"/>
  <path d="M 780 290 C 880 290, 930 240, 1020 210" fill="none" stroke="#818cf8" stroke-width="2" class="data-stream" opacity="0.6"/>

  <!-- Floating Resilient Shield Icon in Center of Tech Wheel -->
  <g class="shield-float" transform="translate(980, 160)">
    <!-- Shield Outer Glow -->
    <path d="M 40 10 L 75 22 C 75 62, 58 92, 40 102 C 22 92, 5 62, 5 22 Z" fill="url(#shieldGrad)" opacity="0.3" filter="url(#glowCyan)"/>
    <!-- Shield Main Body -->
    <path d="M 40 12 L 72 23 C 72 58, 56 86, 40 96 C 24 86, 8 58, 8 23 Z" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="3" />
    <!-- Shield Emblem / Database & Checkmark -->
    <path d="M 28 36 C 28 32, 52 32, 52 36 C 52 40, 28 40, 28 36 Z" fill="none" stroke="#38bdf8" stroke-width="2.2" />
    <path d="M 28 36 V 46 C 28 50, 52 50, 52 46 V 36" fill="none" stroke="#38bdf8" stroke-width="2.2" />
    <path d="M 28 46 V 56 C 28 60, 52 60, 52 56 V 46" fill="none" stroke="#38bdf8" stroke-width="2.2" />
    <!-- Checkmark of Verified Resilience -->
    <polyline points="29,70 37,78 53,62" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Title, Subtitle, and Pills (Clear, crisp, high-contrast) -->
  <g transform="translate(80, 75)">
    <!-- Category Pill -->
    <g class="badge-glow">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="20.5" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Enterprise Application
    </text>
    <text x="0" y="135" fill="url(#cyberCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Backup &amp; Protection
    </text>

    <!-- Tagline / Subtitle -->
    <text x="0" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
      Application-Consistent Workflows • Kubernetes Data Protection • Self-Hosted Engines
    </text>

    <!-- Dynamic Architectural Feature Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="168" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <circle cx="16" cy="18" r="4" fill="#22c55e" />
        <text x="28" y="23" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Database Quiescing</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="164" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <circle cx="16" cy="18" r="4" fill="#38bdf8" />
        <text x="28" y="23" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">K8s Volume CRDs</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(356, 0)">
        <rect x="0" y="0" width="170" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <circle cx="16" cy="18" r="4" fill="#a855f7" />
        <text x="28" y="23" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Immutable Backups</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(538, 0)">
        <rect x="0" y="0" width="176" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <circle cx="16" cy="18" r="4" fill="#f59e0b" />
        <text x="28" y="23" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Ransomware Defense</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" rx="2" fill="url(#cyberCyan)" />
</svg>
